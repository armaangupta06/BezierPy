services:
  # Backend API service
  - type: web
    name: bezierpy-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: ALLOW_ORIGINS
        value: https://bezierpy.vercel.app,http://localhost:3000
